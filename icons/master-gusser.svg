<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Glowing Neon Cyan -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff" />
      <stop offset="100%" stop-color="#008bff" />
    </linearGradient>

    <!-- Glowing Neon Pink/Purple -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners for App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#00f6ff" stroke-width="2" stroke-opacity="0.15" />

  <!-- Subtle Gallows Structure (Glow Background) -->
  <path d="M 120 400 H 220 M 170 400 V 110 H 340 V 150" 
        fill="none" 
        stroke="#1a233a" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Master "M" Letter with Neon Glow -->
  <path d="M 160 330 V 180 L 256 270 L 352 180 V 330" 
        fill="none" 
        stroke="url(#neonCyan)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Word Blank Underline (_) Accent -->
  <line x1="160" y1="380" x2="352" y2="380" 
        stroke="url(#neonPink)" 
        stroke-width="24" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Interactive Spark/Dot (Hint / Discovery element) -->
  <circle cx="352" cy="180" r="12" fill="#00f6ff" filter="url(#glow)" />
</svg>
